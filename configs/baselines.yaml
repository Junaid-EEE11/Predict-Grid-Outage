climatology:
  group_by:
  - month
  - hour
persistence:
  lookback_hours: 1
logistic_regression:
  penalty: l2
  C: 1.0
  solver: lbfgs
  max_iter: 1000
  class_weight: balanced
ridge_regression:
  alpha: 10.0
  fit_intercept: true
lightgbm:
  classification:
    objective: binary
    metric: binary_logloss
    boosting_type: gbdt
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 5.0
    random_state: 42
    n_jobs: -1
  regression:
    objective: regression
    metric: rmse
    boosting_type: gbdt
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
  quantile:
    objective: quantile
    alphas:
    - 0.05
    - 0.1
    - 0.5
    - 0.9
    - 0.95
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    n_jobs: -1
xgboost:
  classification:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 5.0
    random_state: 42
    tree_method: hist
  regression:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    tree_method: hist
