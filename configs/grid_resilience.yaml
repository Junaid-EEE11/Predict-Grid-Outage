feeder_name: IEEE123
base_load_mva: 3.49
voltage_base_kv: 4.16
min_per_unit_voltage: 0.95
max_per_unit_voltage: 1.05
stress_levels:
  low:
    outage_prob_range:
    - 0.0
    - 0.05
    num_contingencies_range:
    - 1
    - 3
    line_failure_rate: 0.02
  moderate:
    outage_prob_range:
    - 0.05
    - 0.2
    num_contingencies_range:
    - 3
    - 7
    line_failure_rate: 0.06
  high:
    outage_prob_range:
    - 0.2
    - 0.5
    num_contingencies_range:
    - 7
    - 14
    line_failure_rate: 0.15
  extreme:
    outage_prob_range:
    - 0.5
    - 1.0
    num_contingencies_range:
    - 14
    - 25
    line_failure_rate: 0.3
monte_carlo:
  num_scenarios_per_case: 200
  seed: 42
  max_repair_hours: 24
  time_steps_hours: 24
decision_experiment:
  hardening_budget_k_lines: 5
  prioritization_metric: outage_criticality_index
