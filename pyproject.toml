[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid_outage_research"
version = "0.1.0"
description = "Uncertainty-Calibrated Spatiotemporal Learning and Physics-Based Resilience Assessment for Weather-Driven Distribution Outages"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Grid Resilience Research Team"}
]
keywords = ["power-systems", "grid-resilience", "outage-prediction", "spatiotemporal-learning", "uncertainty-quantification", "opendss"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "OpenDSSDirect.py>=0.9.0",
    "shapely>=2.0.0",
    "geopandas>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
